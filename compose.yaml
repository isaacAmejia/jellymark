services:
  jellymark-sync:
    build: .
    container_name: JellySync
    restart: unless-stopped
    labels:
      net.unraid.docker.icon: "https://raw.githubusercontent.com/isaacAmejia/jellymark/main/assets/unraid/jellysync.png"
      net.unraid.docker.webui: "http://[IP]:[PORT:8788]/"
      net.unraid.docker.shell: "sh"
    ports:
      - "8788:8788"
    environment:
      DATA_DIR: /data
      PORT: 8788
      JWS_ADMIN_TOKEN: "${JWS_ADMIN_TOKEN:?Set JWS_ADMIN_TOKEN to a long random value}"
    volumes:
      - ./data:/data



